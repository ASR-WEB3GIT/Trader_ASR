name: Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCHANGE: bybit
          SYMBOL: BTC/USDT
          TIMEFRAME: 15m
        run: python signal_bot.py once

      - name: Save state
        run: |
          if [ -f last_signal.txt ] && [ -n "$(git status --porcelain last_signal.txt)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add last_signal.txt
            git commit -m "update last signal"
            git push
          fi
