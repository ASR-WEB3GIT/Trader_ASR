name: Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Telegram-এ টেস্ট মেসেজ পাঠাবেন?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Telegram test message
        if: ${{ github.event.inputs.test_message == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ টেস্ট মেসেজ: সিগন্যাল বট ঠিকমতো যুক্ত হয়েছে।")
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "পাঠানো সফল, Telegram দেখুন।"
          else
            echo "ব্যর্থ: $RESP"
            exit 1
          fi

      - name: Check signal
        if: ${{ github.event.inputs.test_message != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCHANGE: kraken
          SYMBOL: BTC/USDT
          TIMEFRAME: 15m
        run: python signal_bot.py once

      - name: Save state
        run: |
          if [ -f last_signal.txt ] && [ -n "$(git status --porcelain last_signal.txt)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add last_signal.txt
            git commit -m "update last signal"
            git push
          fi
